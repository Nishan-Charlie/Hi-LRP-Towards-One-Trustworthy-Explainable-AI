# NEUCOM revision: seeded AttnLRP cell of the five-metric grid (ViT-B/16 only).
# AttnLRP patches timm classes process-wide, so it runs in its own process
# (xai_bench/isolation.py). Same images, metrics and budgets as
# revision_grid_seeded.yaml; written to its own run directory.

models:
  - "vit_base_patch16_224"

methods:
  - "attnlrp"

metrics:
  - "faithfulness_correlation"
  - "faithfulness_estimate"
  - "pointing_game"
  - "max_sensitivity"
  - "sparseness"

metric_kwargs:
  faithfulness_correlation:
    { nr_runs: 20, subset_size: 224, return_aggregate: false }
  faithfulness_estimate: { features_in_step: 448, return_aggregate: false }
  max_sensitivity: { nr_samples: 3, lower_bound: 0.2 }

dataset: "imagenets_cached"
dataset_kwargs:
  { cache_path: "data/ImageNetS/cache_validation_100.pt", num_samples: 100 }
num_images: 100
seeds: [0]
device: "auto"
input_size: 224
output_dir: "results"
run_name: "revision_grid_seeded_attnlrp"
save_saliency: false
limit_methods_to_supported: true
