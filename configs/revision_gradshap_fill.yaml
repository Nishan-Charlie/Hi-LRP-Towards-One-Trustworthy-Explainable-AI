# NEUCOM revision: GradientSHAP cells of the five-metric grid that have no stored result.
# vit_suite_10 listed gradient_shap but saved no GradientSHAP rows for these four
# backbones, and the July gradient_shap_fill run stopped after one image. Same images,
# metrics and budgets as vit_suite_10; seeded per (seed, model, method, image).

models:
  - "maxvit_small_tf_224"
  - "mobilevitv2_100"
  - "efficientvit_b1"
  - "efficientvit_b2"

methods:
  - "gradient_shap"

metrics:
  - "faithfulness_correlation"
  - "faithfulness_estimate"
  - "pointing_game"
  - "max_sensitivity"
  - "sparseness"

metric_kwargs:
  faithfulness_correlation:
    { nr_runs: 20, subset_size: 224, return_aggregate: false }
  faithfulness_estimate: { features_in_step: 448, return_aggregate: false }
  max_sensitivity: { nr_samples: 3, lower_bound: 0.2 }

dataset: "imagenets_cached"
dataset_kwargs:
  { cache_path: "data/ImageNetS/cache_validation_100.pt", num_samples: 50 }
num_images: 50
seeds: [0]
device: "auto"
input_size: 224
output_dir: "results"
run_name: "revision_gradshap_fill"
save_saliency: false
limit_methods_to_supported: true
