# HiLRP rows for the full quantus metric grid. DEDICATED RUN: hilrp applies
# class-level forward patches that alter every other method's gradients in the
# same process, so this config contains ONLY hilrp (see hilrp_method.py).
# Protocol otherwise identical to vit_suite_10 / rerun_mobilevitv2 for drop-in
# comparability of the rows.

models:
  - "swin_base_patch4_window7_224"
  - "mobilevitv2_100"
  - "efficientvit_b2"
  - "pvt_v2_b2"

methods:
  - "hilrp"

metrics:
  - "faithfulness_correlation"
  - "apf"
  - "faithfulness_estimate"
  - "pointing_game"
  - "max_sensitivity"
  - "sparseness"

metric_kwargs:
  faithfulness_correlation:
    { nr_runs: 20, subset_size: 224, return_aggregate: false }
  apf:
    { nr_runs: 20, subset_size: 224, return_aggregate: false }
  faithfulness_estimate: { features_in_step: 448, return_aggregate: false }
  max_sensitivity: { nr_samples: 3, lower_bound: 0.2 }

dataset: "imagenets_cached"
dataset_kwargs:
  { cache_path: "data/ImageNetS/cache_validation_100.pt", num_samples: 50 }
num_images: 50
seeds: [0]
device: "auto"
input_size: 224
output_dir: "results"
run_name: "hilrp_grid"
save_saliency: false
limit_methods_to_supported: true
