name: conservation tests

# The conservation suite IS the guarantee: thresholds are tied to dtype, so a
# regression in any relevance rule fails the build rather than silently
# degrading a published number.
#
# The install is deliberately minimal. HiLRP's rules are self-contained, and
# xai_bench records (rather than raises) missing optional dependencies, so this
# job needs neither the benchmark stack (captum, quantus) nor the attribution
# backend (lxt, zennit). Keeping it that way is what stops the guarantee from
# silently depending on a heavyweight dependency resolution.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # torch >= 2.9 requires Python >= 3.10.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU torch and test dependencies
        # CPU wheels only: the suite is pure float64 numerics and needs no GPU.
        # torchvision comes first because timm requires it, and installing both
        # from the CPU index keeps pip from pulling the multi-GB CUDA build.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm numpy pytest

      - name: Run the conservation / coverage / equivariance suite
        # No `pip install -e .`: the repo root is on sys.path under `python -m`,
        # and an editable install would drag in the benchmark dependency set
        # this job exists to prove unnecessary.
        run: python -m pytest hilrp/tests/ -v

      - name: Run the harness suite (process isolation, seeding)
        # Same minimal install: these use stub registry entries, so they need
        # no model download and none of the benchmark stack either.
        run: python -m pytest xai_bench/tests/ -v

      - name: Report which registries populated
        # Not a gate, a diagnostic: shows that hilrp imports cleanly while the
        # captum/quantus-backed entries are correctly reported as absent.
        if: always()
        run: python -c "import xai_bench; print(xai_bench.registration_report())"

  backend:
    # The production ports (LXT efficient backend + zennit) on real timm
    # architectures, installed the way a user installs them: `pip install .`
    # resolves the declared dependencies, and the suite then runs against the
    # INSTALLED package from outside the checkout. A module left out of the
    # wheel, or a dependency bound that no longer resolves, fails here.
    #
    # A SEPARATE job on purpose: importing a port patches classes for the life of
    # the interpreter, so this suite must never share a process with the
    # reference suite above, and the reference guarantee must never come to
    # depend on this install.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # resolved: whatever pip picks today, i.e. what a new user gets.
        # 1.0.16:   the timm release the published numbers were produced on.
        timm: ["resolved", "1.0.16"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package as a user would
        # CPU torch first, so the backend's dependencies do not pull the CUDA build.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install . pytest

      - name: Re-pin timm to the validated release
        if: matrix.timm != 'resolved'
        run: pip install "timm==${{ matrix.timm }}"

      - name: Run the production-backend suite against the installed package
        # Random weights, CPU, float32: forward equivalence, finite maps, port
        # coexistence, and bias-free conservation on Swin / PVT-v2.
        working-directory: ${{ runner.temp }}
        run: python -m pytest --pyargs hilrp.tests_backend -v
